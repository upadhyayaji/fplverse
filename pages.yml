## Configure real data

Edit `config/fplverse.json`:

```json
{
  "enabled": true,
  "season": "2025/26",
  "league_id": 123456,
  "manager_ids": [],
  "aliases": {
    "987654": "Apoorv"
  },
  "publish_real_manager_names": true,
  "request_delay_seconds": 0.2
}
```

You can use:

- `league_id` to retrieve every manager in a classic mini-league.
- `manager_ids` to track individual FPL entry IDs.
- Both together; duplicates are removed.
- `aliases` to publish friendly or anonymized display names.

An FPL manager URL usually contains the entry ID:

```text
https://fantasy.premierleague.com/entry/987654/event/38
```

The entry ID is `987654`.

A classic mini-league URL usually contains the league ID:

```text
https://fantasy.premierleague.com/leagues/123456/standings/c
```

The league ID is `123456`.

## Run locally

```bash
python -m venv .venv
python -m pip install -r requirements.txt
python scripts/fetch_fpl.py
python -m http.server 8000
```

Open `http://localhost:8000`.

## Automatic updates

The `Update FPL data` workflow runs daily and can also be launched manually from the repository's **Actions** tab.

The default configuration has `"enabled": false`, so it exits safely until a league ID or manager IDs are added.

## Hosting

The included GitHub Pages workflow publishes the repository as a static website. After the files are uploaded:

1. Open **Settings → Pages**.
2. Under **Build and deployment**, choose **GitHub Actions**.
3. Open the **Actions** tab and run **Deploy FPLVerse to GitHub Pages** if it has not started automatically.

The site address will normally be:

```text
https://upadhyayaji.github.io/fplverse/
```

## Data notes

The collector reads the public JSON responses used by the official FPL website:

- Classic league standings
- Manager profile
- Manager gameweek history

The detailed `current` history normally represents the season that the FPL service currently exposes. Once a new season fully replaces the old one, earlier manager-by-manager gameweek detail may no longer be reconstructable from the standard history response. Keep the archived snapshots in `data/archive/`.

## Privacy

A public repository and GitHub Pages website make the generated JSON visible to visitors. Use aliases and set `publish_real_manager_names` to `false` when you do not want real manager names published.

FPLVerse is an independent fan project and is not affiliated with the Premier League.
