# FPLVerse

FPLVerse is a static Fantasy Premier League analytics dashboard for tracking friends and family across a season.

## What is included

- Cumulative-points race by gameweek
- Weekly-points chart
- Final league table
- Best gameweek, average score, consistency and comeback metrics
- CSV export
- Python collector for classic mini-leagues and individual manager entry IDs
- Archived JSON snapshots
- Scheduled GitHub Actions updates
- GitHub Pages deployment workflow
- Fictional demo data so the site works immediately

