name: Validate FPLVerse

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Run collector tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate static site and data
        run: python scripts/validate_site.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check assets/analytics.mjs
          node --check assets/app.js

      - name: Run frontend analytics tests
        run: node tests/analytics.test.mjs

