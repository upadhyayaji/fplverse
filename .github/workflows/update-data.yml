name: Update FPL data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: fplverse-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run collector tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Collect FPL data
        run: python scripts/fetch_fpl.py

      - name: Validate generated data
        run: python scripts/validate_site.py

      - name: Commit meaningful data changes
        run: |
          if git diff --quiet -- data; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "fplverse-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update FPL data"
          git pull --rebase origin main
          git push origin main

