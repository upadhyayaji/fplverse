name: Refresh official player history
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 2"
permissions:
  contents: write
concurrency:
  group: fplverse-data-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/prediction-history.test.mjs
      - run: node scripts/collect-player-history.mjs
      - name: Persist complete official history
        run: |
          git add data/player-history.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "fplverse-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh official FPL historical player priors"
          git pull --rebase origin main
          git push origin main
